<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E9C9"/>
      <stop offset="55%" stop-color="#CFE3DE"/>
      <stop offset="100%" stop-color="#8FC1BE"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C6E71"/>
      <stop offset="45%" stop-color="#0F4C4C"/>
      <stop offset="100%" stop-color="#0A2E38"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123F45"/>
      <stop offset="100%" stop-color="#0A2E38"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="900" height="330" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="740" cy="110" r="58" fill="url(#sun)" opacity="0.9"/>

  <!-- soft clouds -->
  <g fill="#FFFFFF" opacity="0.55">
    <ellipse cx="150" cy="90" rx="55" ry="18"/>
    <ellipse cx="195" cy="82" rx="40" ry="15"/>
    <ellipse cx="430" cy="60" rx="45" ry="14"/>
    <ellipse cx="470" cy="68" rx="30" ry="11"/>
  </g>

  <!-- distant birds -->
  <g stroke="#0A2E38" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M600 70 q10 -12 20 0 q10 -12 20 0"/>
    <path d="M645 95 q8 -10 16 0 q8 -10 16 0"/>
  </g>

  <!-- ocean -->
  <rect x="0" y="290" width="900" height="210" fill="url(#ocean)"/>
  <path d="M0 300 Q 75 285 150 300 T 300 300 T 450 300 T 600 300 T 750 300 T 900 300 V500 H0 Z" fill="#14595B" opacity="0.6"/>
  <path d="M0 320 Q 75 305 150 320 T 300 320 T 450 320 T 600 320 T 750 320 T 900 320 V500 H0 Z" fill="#0F4C4C" opacity="0.7"/>

  <!-- distant island building (BPG campus) -->
  <g>
    <rect x="405" y="210" width="90" height="90" rx="4" fill="url(#building)"/>
    <rect x="420" y="230" width="14" height="18" fill="#D4AF37" opacity="0.85"/>
    <rect x="443" y="230" width="14" height="18" fill="#D4AF37" opacity="0.85"/>
    <rect x="466" y="230" width="14" height="18" fill="#D4AF37" opacity="0.85"/>
    <rect x="420" y="258" width="14" height="18" fill="#D4AF37" opacity="0.6"/>
    <rect x="443" y="258" width="14" height="18" fill="#D4AF37" opacity="0.6"/>
    <rect x="466" y="258" width="14" height="18" fill="#D4AF37" opacity="0.6"/>
    <rect x="440" y="278" width="20" height="22" fill="#0A2E38"/>
    <rect x="440" y="196" width="4" height="18" fill="#0A2E38"/>
    <path d="M444 196 L470 205 L444 210 Z" fill="#767142"/>
  </g>

  <!-- mountain silhouette (Quatre-Bornes hills) -->
  <path d="M0 300 L90 235 L160 300 Z" fill="#0F4C4C" opacity="0.8"/>
  <path d="M650 300 L740 220 L850 300 Z" fill="#0F4C4C" opacity="0.8"/>

  <!-- palm tree left -->
  <g transform="translate(90,300)">
    <rect x="-6" y="-10" width="12" height="150" rx="6" fill="#0A2E38"/>
    <g fill="#767142">
      <path d="M0 -10 C -60 -40 -95 -10 -110 20 C -70 5 -35 -5 0 -10 Z"/>
      <path d="M0 -10 C 55 -45 95 -20 108 15 C 68 0 30 -8 0 -10 Z"/>
      <path d="M0 -10 C -30 -55 -10 -85 15 -95 C 5 -55 0 -25 0 -10 Z"/>
      <path d="M0 -10 C 25 -50 8 -85 -18 -92 C -6 -52 -2 -25 0 -10 Z"/>
      <path d="M0 -10 C -5 -60 20 -80 45 -78 C 20 -50 8 -25 0 -10 Z"/>
    </g>
  </g>

  <!-- palm tree right -->
  <g transform="translate(800,320) scale(0.85)">
    <rect x="-6" y="-10" width="12" height="150" rx="6" fill="#0A2E38"/>
    <g fill="#0F4C4C">
      <path d="M0 -10 C -60 -40 -95 -10 -110 20 C -70 5 -35 -5 0 -10 Z"/>
      <path d="M0 -10 C 55 -45 95 -20 108 15 C 68 0 30 -8 0 -10 Z"/>
      <path d="M0 -10 C -30 -55 -10 -85 15 -95 C 5 -55 0 -25 0 -10 Z"/>
      <path d="M0 -10 C 25 -50 8 -85 -18 -92 C -6 -52 -2 -25 0 -10 Z"/>
    </g>
  </g>

  <!-- diploma ribbon badge -->
  <g transform="translate(150,375)">
    <circle cx="0" cy="0" r="46" fill="#F7F8FB"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#D4AF37" stroke-width="4"/>
    <path d="M-16 30 L-26 62 L-4 48 L14 62 L6 30 Z" fill="#767142"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="15" fill="#0A2E38">BPG</text>
    <text x="0" y="12" text-anchor="middle" font-family="Georgia, serif" font-weight="600" font-size="9" fill="#0F4C4C">MAURITIUS</text>
  </g>

  <!-- headline plate -->
  <g transform="translate(300,410)">
    <rect x="0" y="0" width="480" height="66" rx="14" fill="#0A2E38" opacity="0.92"/>
    <text x="240" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="0.5">HOTEL MANAGEMENT DIPLOMA</text>
    <text x="240" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="14" fill="#D4AF37" letter-spacing="1.5">IN MAURITIUS</text>
  </g>
</svg>
