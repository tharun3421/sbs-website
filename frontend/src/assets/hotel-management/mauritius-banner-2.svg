<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2E38"/>
      <stop offset="45%" stop-color="#3E6E63"/>
      <stop offset="75%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#F3D48A"/>
    </linearGradient>
    <linearGradient id="ocean2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F4C4C"/>
      <stop offset="100%" stop-color="#082026"/>
    </linearGradient>
    <radialGradient id="sun2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="60%" stop-color="#F3C25B"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </radialGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3C25B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F3C25B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="900" height="330" fill="url(#sky2)"/>

  <!-- stars top -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="120" cy="35" r="1.6"/>
    <circle cx="260" cy="55" r="1.3"/>
    <circle cx="60" cy="75" r="1.4"/>
    <circle cx="340" cy="30" r="1.2"/>
    <circle cx="180" cy="20" r="1.5"/>
  </g>

  <!-- sun low on horizon -->
  <circle cx="640" cy="270" r="70" fill="url(#sunGlow)"/>
  <circle cx="640" cy="270" r="46" fill="url(#sun2)"/>

  <!-- airplane with trail -->
  <g transform="translate(200,90) rotate(-8)">
    <path d="M0 0 L46 4 L58 0 L46 -4 Z" fill="#F7F8FB"/>
    <path d="M20 0 L8 -14 L14 -14 L28 -2 Z" fill="#F7F8FB"/>
    <path d="M20 0 L8 14 L14 14 L28 2 Z" fill="#F7F8FB"/>
    <path d="M-90 6 Q -45 -2 0 0" stroke="#F7F8FB" stroke-width="2" fill="none" opacity="0.45" stroke-dasharray="3 5"/>
  </g>

  <!-- ocean -->
  <rect x="0" y="290" width="900" height="210" fill="url(#ocean2)"/>
  <path d="M0 296 Q 75 282 150 296 T 300 296 T 450 296 T 600 296 T 750 296 T 900 296 V500 H0 Z" fill="#123F45" opacity="0.65"/>
  <path d="M0 315 Q 75 302 150 315 T 300 315 T 450 315 T 600 315 T 750 315 T 900 315 V500 H0 Z" fill="#0A2E38" opacity="0.8"/>
  <!-- sun reflection -->
  <rect x="605" y="290" width="70" height="130" fill="url(#sun2)" opacity="0.25"/>

  <!-- resort silhouette -->
  <g transform="translate(470,205)">
    <path d="M0 95 L0 40 Q40 10 80 40 L80 95 Z" fill="#0A2E38"/>
    <rect x="14" y="55" width="14" height="20" fill="#D4AF37" opacity="0.8"/>
    <rect x="33" y="55" width="14" height="20" fill="#D4AF37" opacity="0.8"/>
    <rect x="52" y="55" width="14" height="20" fill="#D4AF37" opacity="0.8"/>
    <rect x="34" y="75" width="12" height="20" fill="#082026"/>
    <path d="M40 5 L40 40" stroke="#0A2E38" stroke-width="3"/>
    <path d="M40 5 L62 14 L40 20 Z" fill="#767142"/>
  </g>

  <!-- graduate silhouette on shore -->
  <g transform="translate(300,305)">
    <!-- gown -->
    <path d="M-24 90 C -30 40 -18 10 0 6 C 18 10 30 40 24 90 Z" fill="#0A2E38"/>
    <!-- head -->
    <circle cx="0" cy="-8" r="15" fill="#0A2E38"/>
    <!-- cap -->
    <rect x="-20" y="-22" width="40" height="6" fill="#082026"/>
    <path d="M-24 -19 L24 -19 L0 -30 Z" fill="#082026"/>
    <line x1="20" y1="-19" x2="26" y2="4" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="26" cy="6" r="3" fill="#D4AF37"/>
    <!-- diploma scroll raised arm -->
    <path d="M18 30 L34 -2" stroke="#0A2E38" stroke-width="8" stroke-linecap="round"/>
    <rect x="26" y="-16" width="26" height="8" rx="4" fill="#F7F8FB" transform="rotate(-25 26 -16)"/>
    <rect x="26" y="-16" width="26" height="8" rx="4" fill="none" stroke="#D4AF37" stroke-width="1.5" transform="rotate(-25 26 -16)"/>
  </g>

  <!-- palm tree left -->
  <g transform="translate(95,320)">
    <rect x="-6" y="-10" width="12" height="140" rx="6" fill="#082026"/>
    <g fill="#767142">
      <path d="M0 -10 C -55 -38 -88 -8 -100 20 C -64 4 -32 -6 0 -10 Z"/>
      <path d="M0 -10 C -25 -50 -8 -78 15 -85 C 5 -50 0 -22 0 -10 Z"/>
      <path d="M0 -10 C -2 -55 22 -72 45 -68 C 20 -44 8 -22 0 -10 Z"/>
    </g>
  </g>

  <!-- palm tree right -->
  <g transform="translate(830,335) scale(0.8)">
    <rect x="-6" y="-10" width="12" height="140" rx="6" fill="#082026"/>
    <g fill="#0F4C4C">
      <path d="M0 -10 C 55 -40 92 -12 105 18 C 66 3 32 -6 0 -10 Z"/>
      <path d="M0 -10 C 25 -50 8 -80 -18 -87 C -6 -50 -2 -22 0 -10 Z"/>
    </g>
  </g>

  <!-- headline plate -->
  <g transform="translate(230,412)">
    <rect x="0" y="0" width="440" height="66" rx="14" fill="#082026" opacity="0.92"/>
    <text x="220" y="27" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="21" fill="#F3D48A" letter-spacing="1">BPG MAURITIUS</text>
    <text x="220" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="12" fill="#FFFFFF" letter-spacing="1.5" opacity="0.9">HOSPITALITY &amp; BUSINESS DIPLOMAS</text>
  </g>
</svg>
